# DeckReader settings.
#
# This file is created on the first start. Lines starting with # are
# comments. Reading choices (theme, font, sizes, margins...) are changed in
# the reader's menu (the ☰ button) and remembered by the app, not here.
# Every setting is described in docs/CONFIGURATION.md.

[library]
# Folders with books. Add one "folder =" line per folder; subfolders are
# shown as folders. The Flatpak can read ~/Books, Documents, Downloads, the
# microSD card and USB drives; for other folders run once:
#   flatpak override --user --filesystem=/path:ro io.github.nicocarbone.DeckReader
folder = ~/Books

# Show microSD cards and USB drives (mounted under /run/media) on the start
# screen: yes or no.
removable_media = yes

[reader]
# Tap the left or right edge of the touchscreen to turn pages; a tap in the
# middle shows the status overlay: yes or no.
tap_zones = yes

# Keep the screen from dimming and the Deck from sleeping while a book is
# open: yes or no. In the library, SteamOS's own timers apply.
keep_awake = yes

# ...but only until this many minutes pass without a button press or tap
# (1 to 240), so a Deck left on the table still dims and sleeps.
keep_awake_minutes = 10

[interface]
# Size of menus and overlays (not of the book's text): 0.5 to 3.
ui_scale = 1.0

# Recently read books listed on the start screen, below the folders (0 to 20;
# 0 hides the list). Menu > "Remove from recently read" hides one.
recently_read = 5

# Clock in the status overlay: 24h or 12h.
clock = 24h

# Colour of selections and highlights, as #RRGGBB. Default: #10A38F (teal;
# DeckVideoPlayer uses #1A9FFF). Remove the # below to change it.
#accent_color = #10A38F

[wallabag]
# Web articles saved with wallabag (wallabag.it or your own server) appear
# in the library as "Articles". Y on Articles, or Menu > "Update articles",
# downloads the unread ones; "Mark as read in wallabag" archives one. The
# network is used only then.
#
# To turn it on, remove the # from all five lines below and fill them in.
# The client ID and secret come from wallabag's "API clients management"
# page (/developer on the server): "Create a new client", any name. The
# password is kept in this file as written: put it in "quotes" if it starts
# or ends with a space.
#server = https://app.wallabag.it
#client_id =
#client_secret =
#username =
#password =

# How many unread articles to keep on the Deck, newest first (1 to 500).
#max_articles = 50

# Download the articles' pictures from the sites that host them: yes or no
# (no: text only, and only your wallabag server is contacted).
#images = yes

[wikipedia]
# Articles saved in the Wikipedia app (the bookmark, which fills "Saved",
# and your other reading lists) appear in the library as "Wikipedia", a
# folder for each list. Y on it, or Menu > "Update articles", downloads
# them. No wallabag needed. The network is used only then.
#
# To turn it on, make a personal token that can read your lists and change
# nothing, once, in a browser where you are signed in to Wikipedia:
#  1. In the Wikipedia app: Settings > "Sync reading lists" on.
#  2. Open meta.wikimedia.org/wiki/Special:OAuthConsumerRegistration/propose/oauth2
#  3. Any name (DeckReader), version 1.0, a short description.
#  4. Tick "This consumer is for use only by" you.
#  5. "Request authorization for specific permissions": tick only
#     "Access private information". Accept the terms and propose it.
#  6. Copy the "Access token" it shows (once) here, without the #.
#token =

# How many articles to keep from each list, the newest saved first (1 to
# 500). An article in several lists is downloaded once.
#max_articles = 50

# Only these lists, separated by commas ("Saved" is the app's own); all if
# empty. Several "lists =" lines add up.
#lists = Saved, Physics

# Download the articles' pictures (from Wikimedia's servers): yes or no.
#images = yes
